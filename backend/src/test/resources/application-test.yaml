spring:
  datasource:
    url: jdbc:mysql://localhost:3307/database_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root
    password: root_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    # 테스트 환경에서는 org.hibernate.orm.jdbc.bind 비활성화. 로그가 너무 길어진다.
    org.hibernate.sql: DEBUG
