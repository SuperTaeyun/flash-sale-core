name: Bug
description: 기존 기능의 오류를 수정.
title: "[BUG]: "
labels:
  - bug
projects: [ "SuperTaeyun/2" ]
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제 상황
      description: 어떤 문제가 발생했는가.
      placeholder: |
        예: 재고가 1개 남은 상품에 동시에 주문 요청을 보내면 재고가 음수가 되는 문제가 발생한다.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제를 재현하는 방법은 무엇인가.
      placeholder: |
        1. 재고가 1개인 상품을 생성한다.
        2. 동시에 2개의 주문 요청을 보낸다.
        3. 재고가 -1이 된다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
      description: 정상적으로 동작한다면 어떤 결과여야 하는가.
      placeholder: |
        재고가 0 이하로 내려가지 않아야 한다.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 버그가 해결되었다고 판단할 기준.
      placeholder: |
        - [ ] 문제가 재현되지 않는다.
        - [ ] 관련 테스트가 추가되었다.
        - [ ] 전체 테스트가 통과한다.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 사항
      description: (Optional) 관련 문서, 이슈 등을 추가한다.
      placeholder: |
        관련 문서나 Issue.
    validations:
      required: false