services:
  database:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: database
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  database_test:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: database_test
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"

volumes:
  mysql_data: